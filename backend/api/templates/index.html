{% extends "base.html" %}

{% block content %}
<main class="relative min-h-screen overflow-hidden" x-data="placesFinder">
    <!-- Printed-poster ground: one warm spotlight + paper grain (still, not animated blobs) -->
    <div class="poster-bg" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="relative z-10">
        <!-- Language toggle: reloads the page with ?lang=, which also sets the lang cookie. -->
        <nav class="absolute top-4 right-4 flex rounded-full p-0.5 font-public-sans text-[11px] font-bold"
             style="background-color:var(--surface); border:1px solid var(--line);" aria-label="Language">
            {% for code, label in [("vi", "VI"), ("en", "EN")] %}
            <a href="/?lang={{ code }}" class="px-3 py-1 rounded-full transition-colors"
               {% if code == lang %}aria-current="true" style="background-color:var(--accent); color:var(--ground);"
               {% else %}style="color:var(--ink-dim);"{% endif %}>{{ label }}</a>
            {% endfor %}
        </nav>

        <div class="max-w-md mx-auto px-6 pt-20 pb-6">
            <div class="text-center">
                <p class="eyebrow rise rise-1 font-public-sans text-[11px] font-semibold uppercase mb-3"
                   style="color:var(--tan); opacity:0.7;">{{ t.eyebrow }}</p>
                <h1 class="wordmark font-bungee leading-[0.9] mb-4 rise rise-2"
                    style="font-size:clamp(2.5rem, 15vw, 4.25rem);">
                    <span class="block">Places</span>
                    <span class="block dot">Finder</span>
                </h1>
                <p class="rise rise-3 font-public-sans text-sm mb-8" style="color:var(--ink-dim);">
                    {{ t.tagline }}
                </p>
            </div>

            <template x-if="denied">
                <p class="font-public-sans text-xs mb-4 text-center" style="color:#e0a56e;">
                    {{ t.geo_denied }}
                </p>
            </template>
            <template x-if="error">
                <p class="font-public-sans text-xs mb-4 text-center" style="color:#e0a56e;" x-text="error"></p>
            </template>

            <form x-ref="form" @submit.prevent="onSubmit()" class="panel p-4 space-y-3 text-left rise rise-4">
                <label class="block">
                    <span class="font-public-sans text-[11px] font-semibold uppercase tracking-wider" style="color:var(--ink-dim);">{{ t.label_query }}</span>
                    <input x-ref="query" type="text" name="query_text"
                        placeholder="{{ t.placeholder_query }}"
                        class="search-field w-full mt-1.5 rounded-xl px-4 py-3 font-public-sans text-sm border-0"
                        style="background-color:var(--well); color:var(--ink);">
                </label>

                <div class="grid grid-cols-5 gap-3">
                    <label class="col-span-3 block">
                        <span class="font-public-sans text-[11px] font-semibold uppercase tracking-wider" style="color:var(--ink-dim);">{{ t.label_location }}</span>
                        <input type="text" x-model="address"
                            placeholder="{{ t.placeholder_location }}"
                            class="search-field w-full mt-1.5 rounded-xl px-4 py-3 font-public-sans text-sm border-0"
                            style="background-color:var(--well); color:var(--ink);">
                    </label>
                    <label class="col-span-2 block">
                        <span class="font-public-sans text-[11px] font-semibold uppercase tracking-wider" style="color:var(--ink-dim);">{{ t.label_radius }}</span>
                        <select x-ref="radius" name="radius_m"
                            class="search-field w-full mt-1.5 rounded-xl px-3 py-3 font-public-sans text-sm border-0"
                            style="background-color:var(--well); color:var(--ink);">
                            <option value="1000">1 km</option>
                            <option value="3000" selected>3 km</option>
                            <option value="5000">5 km</option>
                        </select>
                    </label>
                </div>

                <button type="submit" :disabled="locating || searching"
                    class="btn-primary w-full rounded-xl py-3.5 mt-1 font-bungee text-sm tracking-wide disabled:opacity-40">
                    <span x-show="locating">{{ t.btn_locating }}</span>
                    <span x-show="!locating && searching">{{ t.btn_searching }}</span>
                    <span x-show="!locating && !searching">{{ t.btn_search }}</span>
                </button>
            </form>

            <!-- Live streaming status: pulsing dot + running count as cards arrive. -->
            <div x-show="searching" x-cloak class="flex items-center justify-center gap-2 mt-4 font-public-sans text-sm" style="color:var(--ink-dim);">
                <span class="pulse-dot inline-block w-2 h-2 rounded-full" style="background-color:var(--accent);"></span>
                <span x-show="count === 0">{{ t.status_searching }}</span>
                <span x-show="count > 0" x-text="T.status_found.replace('{count}', count)"></span>
            </div>
        </div>

        <div id="results" class="pb-12"></div>
    </div>
</main>

<script>
// UI strings for the current language (see backend/api/i18n.py), for messages set from JS.
const LANG = {{ lang | tojson }};
const T = {{ t | tojson }};
document.addEventListener('alpine:init', () => {
    Alpine.data('placesFinder', () => ({
        lat: null, lng: null, address: '', locating: true, denied: false,
        searching: false, error: null, count: 0, es: null,

        init() {
            if (!navigator.geolocation) { this.locating = false; this.denied = true; return; }
            // Some browsers (notably Safari on a non-HTTPS origin) never call either callback at
            // all instead of erroring, which would leave the button disabled forever — force a
            // resolution after 6s so the manual address fallback stays reachable.
            const timeout = setTimeout(() => { this.locating = false; this.denied = true; }, 6000);
            navigator.geolocation.getCurrentPosition(
                pos => { clearTimeout(timeout); this.lat = pos.coords.latitude; this.lng = pos.coords.longitude; this.locating = false; },
                () => { clearTimeout(timeout); this.locating = false; this.denied = true; }
            );
        },

        async onSubmit() {
            this.error = null;
            if (this.lat === null || this.lng === null) {
                const addr = this.address.trim();
                if (!addr) { this.error = T.err_need_location; return; }
                // Coordinates pasted straight from Google Maps (e.g. "21.028511, 105.804817").
                const coordMatch = addr.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
                if (coordMatch) {
                    this.lat = parseFloat(coordMatch[1]);
                    this.lng = parseFloat(coordMatch[2]);
                } else {
                    try {
                        const res = await fetch('/api/geocode?address=' + encodeURIComponent(addr));
                        if (!res.ok) { this.error = T.err_address_not_found; return; }
                        const data = await res.json();
                        this.lat = data.lat; this.lng = data.lng;
                    } catch (e) { this.error = T.err_geocode_failed; return; }
                }
            }
            this.startStream();
        },

        startStream() {
            if (this.es) { this.es.close(); this.es = null; }
            this.error = null; this.count = 0; this.searching = true;

            const results = document.getElementById('results');
            results.innerHTML = '<div id="carousel" class="carousel flex overflow-x-auto snap-x snap-mandatory"></div>';
            const carousel = document.getElementById('carousel');
            for (let i = 0; i < 3; i++) carousel.insertAdjacentHTML('beforeend', this.skeletonSlide());

            const q = new URLSearchParams({
                lat: this.lat, lng: this.lng,
                query_text: this.$refs.query.value || '',
                radius_m: this.$refs.radius.value || '',
                lang: LANG,
            });
            const es = new EventSource('/api/search/stream?' + q.toString());
            this.es = es;

            es.addEventListener('place', e => {
                if (this.count === 0) carousel.querySelectorAll('.skeleton-slide').forEach(s => s.remove());
                this.count++;
                this.appendSlide(carousel, e.data);
            });
            es.addEventListener('done', () => {
                this.finish();
                if (this.count === 0) {
                    results.innerHTML = '<p class="font-public-sans text-sm text-center" style="color:#a8927e;"></p>';
                    results.firstElementChild.textContent = T.no_results;
                }
            });
            es.addEventListener('error', () => { this.finish(); if (this.count === 0) this.error = T.err_search_failed; });
            es.onerror = () => { if (this.searching) { this.finish(); if (this.count === 0) this.error = T.err_connection_lost; } };
        },

        finish() { this.searching = false; if (this.es) { this.es.close(); this.es = null; } },

        appendSlide(carousel, html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html.trim();
            const slide = tmp.firstElementChild;
            if (!slide) return;
            // Order by score via flexbox `order` (not DOM re-insert) so already-shown cards don't
            // re-run their entrance animation when a higher-ranked card streams in later.
            slide.style.order = Math.round(-parseFloat(slide.dataset.score || 0) * 1000);
            carousel.appendChild(slide);
        },

        skeletonSlide() {
            return `
                <div class="skeleton-slide w-full shrink-0 snap-center flex justify-center px-4 py-1">
                  <div class="w-full max-w-sm">
                    <div class="rounded-2xl overflow-hidden" style="background-color:#2E1F11;">
                      <div class="skeleton" style="aspect-ratio:4/3;"></div>
                      <div class="p-4 space-y-2">
                        <div class="skeleton h-5 w-2/3 rounded"></div>
                        <div class="skeleton h-3 w-full rounded"></div>
                        <div class="skeleton h-3 w-1/2 rounded"></div>
                      </div>
                    </div>
                  </div>
                </div>`;
        },
    }));
});
</script>
{% endblock %}
