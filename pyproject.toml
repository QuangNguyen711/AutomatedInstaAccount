[project]
name = "placesfinder"
version = "0.1.0"
description = "Personal search engine for cafes/restaurants matching specific requirements, scraped from Google Maps"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pgvector>=0.3",
    "patchright>=1.48",
    "ultralytics>=8.3",
    "pillow>=10.4",
    "torch>=2.0",
    "torchvision>=0.15",
    "httpx>=0.27",
    "openlocationcode>=1.0.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
